<footer class="bg-white border-t border-slate-200">
  <div class="max-w-[1080px] mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3.5">
      <div class="flex items-center gap-2.5">
        <a
          routerLink="/"
          class="inline-flex items-center gap-2 text-[15px] font-bold tracking-tight text-slate-900"
        >
          <span class="brand-mark brand-mark-xs" aria-hidden="true"><app-icon name="cards" /></span>
          <span>Stack<span class="brand-light">SSP</span></span>
        </a>
        <span class="version-badge">v{{ appVersion }}</span>
      </div>
      <span class="hidden sm:inline text-slate-300" aria-hidden="true">·</span>
      <p class="text-[13px] text-slate-600">
        © {{ currentYear }} Tonio Velayos · Todos los derechos reservados.
      </p>
    </div>

    <nav aria-label="Navegación del pie de página" class="flex items-center gap-5 text-[13px] font-semibold">
      <a routerLink="/" class="footer-link">Inicio</a>
      <a [routerLink]="courseRoute()" class="footer-link">Curso</a>
    </nav>
  </div>
</footer>
